<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dispatch">
  <meta name="theme-color" content="#000000">
  <title>DispatchFreeBuff</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css?v=1783879213811">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/core.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/languages/javascript.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/languages/typescript.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/languages/python.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/languages/bash.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/languages/json.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/languages/xml.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/languages/css.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/languages/markdown.min.js" defer></script>
</head>
<body class="app">

  <section id="connect-gate" class="connect-gate hidden">
    <div class="wordmark">term<span class="cursor">_</span></div>
    <p class="connect-tagline">Access your PC's terminal from your iPhone, wherever you are.</p>
    <div class="connect-status">
      <span id="gate-dot" class="dot dot-off" aria-hidden="true"></span>
      <span id="gate-status-text">not paired</span>
    </div>
    <button id="gate-pair-btn" type="button" class="primary-btn pill-btn">Pair device</button>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <header class="hdr">
      <div class="hdr-left">
        <span id="status-dot" class="dot dot-off" aria-hidden="true"></span>
        <span class="hdr-title" id="hdr-title">Dispatch</span>
        <span class="status-text" id="status-text">offline</span>
      </div>
      <div class="hdr-right">
        <span id="auth-badge" class="auth-badge hidden" title="End-to-end encryption status">
          <span aria-hidden="true">🔒</span><span id="auth-text">E2E</span>
        </span>
      </div>
    </header>

    <section id="screen-terminal" class="screen">
      <main id="messages" class="messages" aria-live="polite"></main>
      <div id="key-controls" class="key-controls">
        <button type="button" class="key-btn" data-key="up" aria-label="Up">↑</button>
        <button type="button" class="key-btn" data-key="down" aria-label="Down">↓</button>
        <button type="button" class="key-btn" data-key="left" aria-label="Left">←</button>
        <button type="button" class="key-btn" data-key="right" aria-label="Right">→</button>
        <button type="button" class="key-btn key-btn-wide" data-key="escape" aria-label="Escape">Esc</button>
        <button type="button" id="enter-btn" class="key-btn key-btn-wide key-btn-accent" aria-label="Enter">Enter</button>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Ask Freebuff…  (⏎ send · ⇧⏎ newline · /cd path to switch folder)" class="input" aria-label="Prompt" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      </form>
    </section>

    <section id="screen-commands" class="screen hidden">
      <div class="screen-header">saved commands</div>
      <div id="commands-list" class="commands-list"></div>
    </section>

    <section id="screen-settings" class="screen screen-settings hidden">
      <div class="settings-card">
        <div class="settings-card-title">connection</div>
        <div class="settings-row"><span>host</span><span id="set-host">—</span></div>
        <div class="settings-row"><span>state</span><span id="set-status">—</span></div>
        <div class="settings-row"><span>encryption</span><span id="set-enc">—</span></div>
      </div>
      <div class="settings-card">
        <div class="settings-card-title">push notifications</div>
        <div class="settings-row"><span>standalone</span><span id="set-standalone">—</span></div>
        <div class="settings-row"><span>push API</span><span id="set-push-api">—</span></div>
        <div class="settings-row"><span>permission</span><span id="set-push-perm">—</span></div>
        <div class="settings-row"><span>subscribed</span><span id="set-push-sub">—</span></div>
      </div>
      <div class="settings-card">
        <div class="settings-row toggle-row" id="sound-row">
          <span>sound on send</span>
          <div id="sound-toggle" class="toggle"><div class="toggle-knob"></div></div>
        </div>
      </div>
      <div class="settings-card">
        <button type="button" class="settings-action" data-act="reconnect">Reconnect <span class="menu-kbd">R</span></button>
        <button type="button" class="settings-action" data-act="clear">Clear chat</button>
        <button type="button" class="settings-action" data-act="copy-fp">Copy fingerprint</button>
        <button type="button" class="settings-action" data-act="enable-push">Enable push notifications</button>
      </div>
      <button type="button" id="disconnect-btn" class="danger-btn">end session</button>
    </section>

    <nav class="tabbar">
      <button type="button" class="tab-btn active" data-tab="terminal">term</button>
      <button type="button" class="tab-btn" data-tab="commands">cmds</button>
      <button type="button" class="tab-btn" data-tab="settings">conf</button>
    </nav>
  </div>

  <script src="/app.js?v=1783879213811"></script>
</body>
</html>
