<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Pair · DispatchFreeBuff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css?v=1783922258400">
</head>
<body class="app pair">
  <div class="pair-card">
    <div class="pair-logo" aria-hidden="true">📡</div>
    <h1>DispatchFreeBuff</h1>
    <p class="sub">On the PC, run <code>dispatch pair</code>, then paste the link it prints below — or enter the session ID and code manually.</p>

    <input id="session" class="session-input" placeholder="paste the pairing link, or session ID"
           autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"
           aria-label="Session ID or pairing link">

    <form id="manual" class="manual-form">
      <input id="code" class="code-input" maxlength="6" placeholder="ABC123"
             autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"
             aria-label="Pairing code">
      <button type="submit" class="primary-btn">Pair</button>
    </form>

    <p id="status" class="status"></p>

    <details class="scan-block">
      <summary>Or scan with the camera</summary>
      <video id="cam" class="cam" playsinline muted></video>
      <canvas id="overlay" class="hidden"></canvas>
    </details>
  </div>

  <script src="/pair.js?v=1783922258400"></script>
</body>
</html>
