name: Build iOS shell

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['ios-app/**', '.github/workflows/build-ios.yml']

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios

      - name: pod install
        working-directory: ios-app/ios/App
        run: pod install

      # Unsigned build — AltStore/AltServer does the actual code signing with
      # your free Apple ID at sideload time, so CI never needs certificates.
      - name: xcodebuild (unsigned)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .ipa
        working-directory: ios-app/ios/App
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/App.app Payload/
          zip -r DispatchFreeBuff.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DispatchFreeBuff-ipa
          path: ios-app/ios/App/DispatchFreeBuff.ipa
